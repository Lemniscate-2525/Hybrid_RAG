version: "3.8"

services:
  # Vector Database
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: hybrid_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Distributed Caching & Rate Limiting
  redis:
    image: redis:7.4-alpine
    container_name: hybrid_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Production FastAPI Backend
  backend:
    build: .
    container_name: hybrid_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - Qdrant_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - Collection_Name=hybrid_rag_documents
      - MistralAI=${MistralAI:-}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_in_production_min_32_chars}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/app/data

  # Streamlit User Interface
  frontend:
    build: .
    container_name: hybrid_rag_frontend
    restart: unless-stopped
    command: ["streamlit", "run", "src/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  qdrant_storage:
  redis_data:
  app_data:

